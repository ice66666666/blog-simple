services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: blog_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - blog_network

  # Backend Flask
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blog_backend
    environment:
      - FLASK_APP=${FLASK_APP}
      - FLASK_ENV=${FLASK_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # S3/MinIO
      - S3_BUCKET=${S3_BUCKET}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_REGION=${S3_REGION}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE}
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - minio
    networks:
      - blog_network
    restart: unless-stopped

  # Frontend React (FIX)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blog_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app         # monta todo el código
      - /app/node_modules       # volumen anónimo para deps
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - HOST=0.0.0.0
      - PORT=3000
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - blog_network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola Web
    volumes:
      - minio_data:/data
    networks:
      - blog_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Client para crear bucket y hacerlo público
  minio_mc:
    image: minio/mc:latest
    container_name: minio_mc
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - blog_network
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -e;
      echo "Esperando que MinIO esté listo...";
      sleep 5;
      # Configurar alias
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123} || (echo "Error configurando alias, reintentando..."; sleep 5; mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123});
      echo "Alias configurado";
      # Crear bucket si no existe
      mc mb --ignore-existing local/${S3_BUCKET:-blog} || echo "Bucket ya existe o error al crearlo";
      echo "Bucket verificado";
      # Hacerlo público (permite GET anónimo)
      mc anonymous set download local/${S3_BUCKET:-blog} || echo "Error configurando acceso público";
      echo "Bucket ${S3_BUCKET:-blog} configurado como público (download)";
      # Verificar
      mc anonymous get local/${S3_BUCKET:-blog};
      echo "Configuración completada";

volumes:
  postgres_data:
  minio_data:

networks:
  blog_network:
    driver: bridge
